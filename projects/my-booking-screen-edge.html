<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বুকিং সারাংশ — দীর্ঘ নাম</title>
<style>
  :root {
    --navy-900: #0A2540; --navy-700: #16375A;
    --green-600: #00A651; --green-50: #E7F7EE;
    --neutral-0: #FFFFFF; --neutral-50: #F6F7F9;
    --neutral-200: #E1E5EA; --neutral-500: #6B7684; --neutral-900: #171B21;
    --text-xs: 12px; --text-sm: 14px; --text-base: 16px; --text-lg: 20px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
    --radius-sm: 8px; --radius-md: 12px;
    --touch-min: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans Bengali','Inter',system-ui,sans-serif; background: var(--neutral-50); color: var(--neutral-900); display:flex; justify-content:center; }
  .screen { width: 390px; min-height: 100vh; display:flex; flex-direction:column; }
  .header { background: var(--navy-900); color:#fff; padding: var(--space-md); display:flex; align-items:center; gap: var(--space-md); }
  .back-btn { width: var(--touch-min); height: var(--touch-min); border:none; background:none; color:#fff; font-size: var(--text-lg); margin-left: calc(-1 * var(--space-sm)); }
  .header h1 { font-size: var(--text-lg); font-weight:700; }
  .content { flex:1; padding: var(--space-md); display:flex; flex-direction:column; gap: var(--space-md); }
  .card { background:#fff; border:1px solid var(--neutral-200); border-radius: var(--radius-md); padding: var(--space-md); }
  .tutor-card { display:flex; gap: var(--space-md); align-items:flex-start; }
  .tutor-avatar {
    width: 56px; height: 56px; border-radius: var(--radius-md);
    background: var(--navy-700); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size: var(--text-lg); flex-shrink:0;
  }
  .tutor-info { min-width: 0; }
  .tutor-info h2 {
    font-size: var(--text-base); font-weight:600;
    word-break: break-word; overflow-wrap: break-word; line-height: 1.3;
  }
  .tutor-info p { font-size: var(--text-sm); color: var(--neutral-500); margin-top: var(--space-xs); }
  .detail-row { display:flex; justify-content:space-between; gap: var(--space-md); padding: var(--space-sm) 0; border-bottom:1px solid var(--neutral-200); font-size: var(--text-sm); }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color: var(--neutral-500); flex-shrink:0; }
  .detail-value { font-weight:600; text-align:right; word-break: break-word; overflow-wrap: break-word; }
  .cta-wrap { padding: var(--space-md); background:#fff; border-top:1px solid var(--neutral-200); }
  .cta-btn { width:100%; min-height: var(--touch-min); background: var(--green-600); color:#fff; border:none; border-radius: var(--radius-sm); font-size: var(--text-base); font-weight:600; }
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <button class="back-btn" aria-label="ফিরে যান">←</button>
    <h1>বুকিং সারাংশ</h1>
  </div>
  <div class="content">
    <div class="card tutor-card">
      <div class="tutor-avatar">মো</div>
      <div class="tutor-info">
        <h2>মোহাম্মদ শামসুদ্দিন আহমেদ চৌধুরী</h2>
        <p>উচ্চতর গণিত ও পদার্থবিজ্ঞান · এইচএসসি</p>
      </div>
    </div>
    <div class="card">
      <div class="detail-row">
        <span class="detail-label">শিক্ষার্থী</span>
        <span class="detail-value">ফাতেমা তুজ জোহরা বিনতে করিম</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">তারিখ ও সময়</span>
        <span class="detail-value">১২ সেপ্টেম্বর, বিকাল ৪:০০</span>
      </div>
    </div>
  </div>
  <div class="cta-wrap">
    <button class="cta-btn">পেমেন্টে যান</button>
  </div>
</div>
</body>
</html>
